services:
  backend:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
    volumes:
      - private_uploads:/app/private_uploads
      - public_uploads:/app/uploads/public

volumes:
  private_uploads:
    name: hotel-app-private-uploads
    driver: local
  public_uploads:
    name: hotel-app-public-uploads
    driver: local
