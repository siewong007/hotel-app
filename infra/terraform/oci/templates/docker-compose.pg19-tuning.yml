# Development-only PostgreSQL 19 Beta tuning. This file is opt-in because the
# beta image and these memory assumptions are not production defaults.
services:
  postgres:
    image: postgres:19beta3
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
      - -c
      - io_method=worker
      - -c
      - io_min_workers=2
      - -c
      - io_max_workers=8
      - -c
      - effective_io_concurrency=32
      - -c
      - maintenance_io_concurrency=32
      - -c
      - autovacuum_max_parallel_workers=2
      - -c
      - autovacuum_analyze_score_weight=2.0
      - -c
      - autovacuum_vacuum_score_weight=1.5
      - -c
      - autovacuum_vacuum_insert_score_weight=1.25
      - -c
      - vacuum_max_eager_freeze_failure_rate=0.05
      - -c
      - default_toast_compression=lz4
      - -c
      - jit=off
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=8MB
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=zstd
      - -c
      - random_page_cost=1.1

  pg19-tuner:
    depends_on:
      postgres:
        condition: service_healthy
