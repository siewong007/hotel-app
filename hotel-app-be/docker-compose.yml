services:
  postgres:
    image: postgres:19beta1-alpine
    container_name: hotel-app-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
      POSTGRES_DB: hotel_management
    ports:
      - "5433:5432"
    volumes:
      # postgres:19 images require the mount at /var/lib/postgresql (data lives
      # in a version subdir) — mounting at .../data makes the container refuse to start
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
