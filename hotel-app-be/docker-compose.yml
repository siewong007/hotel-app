services:
  postgres:
    image: postgres:19beta2-alpine
    container_name: hotel-app-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or .env file}
      POSTGRES_DB: hotel_management
    ports:
      # Loopback only: publishing on all interfaces exposed the dev database
      # to the local network.
      - "127.0.0.1:5433:5432"
    volumes:
      # postgres:19 images require the mount at /var/lib/postgresql (data lives
      # in a version subdir) — mounting at .../data makes the container refuse to start
      - postgres_data:/var/lib/postgresql
      - ./database/postgres/migrations/0001_v1_baseline.sql:/docker-entrypoint-initdb.d/01_v1_baseline.sql:ro
      - ./database/postgres/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
