# cargo-audit configuration
#
# Advisories listed here are reviewed and intentionally ignored, each with a
# documented rationale. Keep this list minimal and revisit on every dependency
# bump — an entry is only justified while the reasoning below still holds.

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — rsa "Marvin Attack" timing sidechannel.
    # No fixed upgrade is available upstream. rsa is only pulled into Cargo.lock
    # via sqlx's optional `mysql` backend, which this project never enables (we
    # build with the PostgreSQL feature only). `cargo tree -i rsa`
    # confirms it is absent from the compiled dependency graph, so the timing
    # sidechannel is not reachable in any artifact we ship. Re-evaluate if a
    # MySQL backend is ever added or a fixed rsa release lands.
    "RUSTSEC-2023-0071",

    # RUSTSEC-2026-0235 — rkyv insufficient archive validation (out-of-bounds
    # reads in archives containing Rc/Arc). The fix is rkyv >=0.8.17, which no
    # dependency here can take: rkyv is pulled into Cargo.lock only by
    # rust_decimal's OPTIONAL `rkyv` feature, which this project never enables,
    # and rust_decimal (1.42.1, latest) still pins the 0.7 line for it.
    # `cargo tree -i rkyv --all-features --target all` prints "nothing to
    # print", confirming rkyv is absent from the compiled dependency graph, so
    # no artifact we ship contains the affected code or deserializes an rkyv
    # archive. cargo audit reads Cargo.lock rather than the build graph, which
    # is why it fires anyway. Re-evaluate if rust_decimal's `rkyv` feature is
    # ever enabled or a rust_decimal release moves to rkyv >=0.8.17.
    "RUSTSEC-2026-0235",
]
