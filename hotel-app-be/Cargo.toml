[package]
name = "hotel-app-be"
version = "0.2.0"
edition = "2024"
rust-version = "1.95.0"

[lib]
name = "hotel_app_be"
path = "src/lib.rs"

[[bin]]
name = "hotel-app-be"
path = "src/main.rs"

[features]
default = ["postgres"]
postgres = ["sqlx/postgres"]

[dependencies]
tokio = { version = "1.51", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.12", features = ["cookie"] }
# `time` is used to set the refresh-cookie Max-Age; version pinned to match the
# `cookie` crate re-exported by axum-extra (avoids a duplicate `time` in the tree).
time = "0.3"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "rust_decimal", "json"] }
clap = { version = "4", features = ["derive"] }
bcrypt = "0.19"
# jsonwebtoken 10 requires exactly one crypto provider. We only sign HMAC JWTs,
# so use its pure-Rust provider explicitly instead of allowing a runtime panic
# the first time an access token is created.
jsonwebtoken = { version = "10.4", default-features = false, features = ["rust_crypto"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.16", features = ["v4", "v7", "serde"] }
rust_decimal = "1.37"
# webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }  # Requires OpenSSL - disabled for Windows build
base64 = "0.22"
hex = "0.4"
thiserror = "2.0"
anyhow = "1.0"
simplelog = "0.12"
dirs = "5"
log = "0.4"
sha2 = "0.11"
hmac = "0.13"
# PayPal REST client (hand-rolled; no official Rust SDK). rustls-tls matches the
# lettre TLS backend so no OpenSSL/native-tls is required.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "pool", "tokio1", "tokio1-rustls-tls"] }
rand = "0.10"
regex = "1.11"
ring = "0.17"
constant_time_eq = "0.5"
validator = { version = "0.20", features = ["derive"] }
ammonia = "4.1.4"
dotenvy = "0.15"
# 2FA dependencies
totp-rs = { version = "5.7", features = ["qr"] }
data-encoding = "2.8"
image = "0.25"
qrcode = "0.14"
# Rate limiting is implemented in-memory (core/rate_limiter.rs) - no external dependency needed

[dev-dependencies]
tokio = { version = "1.51", features = ["rt-multi-thread", "macros"] }
tokio-test = "0.4"
# NOTE: no dev-dependency on reqwest — tests/examples get the rustls-only build
# from [dependencies]. Re-adding it with default features would drag
# native-tls/OpenSSL back into the lockfile (Dependabot alert class).

# Trim debug-build disk usage: line tables keep usable panic backtraces /
# file:line info while dropping the bulk of DWARF debug info from every .rlib/.o.
[profile.dev]
debug = "line-tables-only"

[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 1
strip = false
debug = 0

[profile.release.build-override]
codegen-units = 16
# Keep proc-macro/build-script dylibs loadable on macOS release builds.
debug = 1
opt-level = 0

[profile.release-fast.build-override]
codegen-units = 16
# Keep proc-macro/build-script dylibs loadable on macOS release builds.
debug = 1
opt-level = 0
