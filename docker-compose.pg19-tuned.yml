services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
      - -c
      - io_method=worker
      - -c
      - io_min_workers=${PG19_IO_MIN_WORKERS:-2}
      - -c
      - io_max_workers=${PG19_IO_MAX_WORKERS:-8}
      - -c
      - effective_io_concurrency=${PG19_EFFECTIVE_IO_CONCURRENCY:-32}
      - -c
      - maintenance_io_concurrency=${PG19_MAINTENANCE_IO_CONCURRENCY:-32}
      - -c
      - autovacuum_max_parallel_workers=${PG19_AUTOVACUUM_PARALLEL_WORKERS:-2}
      - -c
      - autovacuum_analyze_score_weight=${PG19_AUTOVACUUM_ANALYZE_WEIGHT:-2.0}
      - -c
      - autovacuum_vacuum_score_weight=${PG19_AUTOVACUUM_VACUUM_WEIGHT:-1.5}
      - -c
      - autovacuum_vacuum_insert_score_weight=${PG19_AUTOVACUUM_INSERT_WEIGHT:-1.25}
      - -c
      - vacuum_max_eager_freeze_failure_rate=${PG19_EAGER_FREEZE_FAILURE_RATE:-0.05}
      - -c
      - default_toast_compression=lz4
      - -c
      - jit=off

  pg19-tuner:
    image: postgres:19beta2
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_TO_STRONG_PASSWORD_MIN_16_CHARS}
    volumes:
      - ./hotel-app-be/database/postgres/optimization/pg19_beta2.sql:/opt/hotel-app/pg19_beta2.sql:ro
    command:
      - psql
      - --host=postgres
      - --username=${POSTGRES_USER:-hotel_admin}
      - --dbname=${POSTGRES_DB:-hotel_management}
      - --set=ON_ERROR_STOP=1
      - --file=/opt/hotel-app/pg19_beta2.sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotel-network

  backend:
    depends_on:
      pg19-tuner:
        condition: service_completed_successfully
