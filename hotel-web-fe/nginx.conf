# Sibu's weather for the landing page's header and film
# (salim-inn/src/atmosphere/weather.ts). Every visitor is served one copy of MET
# Norway's forecast from this origin, refetched only when MET's Expires header
# says it may be (about every half hour), so no visitor's browser talks to a
# third party and the CSP stays 'self'. Lives in the http context (this file is
# included there as conf.d/default.conf).
proxy_cache_path /var/cache/nginx/weather levels=1 keys_zone=weather:1m max_size=2m inactive=1d use_temp_path=off;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at Cloudflare and Caddy, so nginx only ever sees plain http and
    # its default absolute redirects said `Location: http://saliminn.my/...`:
    # every anonymous visit to `/` took an extra hop through Cloudflare's
    # http->https redirect (and a plaintext request on the way). A relative
    # Location resolves against the https URL the browser actually used.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com https://challenges.cloudflare.com https://accounts.google.com https://*.googleapis.com; frame-src 'self' https://challenges.cloudflare.com https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json;

    # The Vite entry document changes whenever its hashed module references do.
    # Never let a browser keep an older copy that points at assets from a prior
    # deployment.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Guest mini-app shell is identical for every ?token= pay link. Cache it at
    # the edge for a short TTL so Gmail clicks do not wait on the origin HTML.
    # Hashed /assets/* remain immutable; a deploy updates this file's module tags.
    location = /guest.html {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com https://challenges.cloudflare.com https://accounts.google.com https://*.googleapis.com; frame-src 'self' https://challenges.cloudflare.com https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Same rule, for every OTHER html entry document. The build has more than one
    # (see `rollupOptions.input` in vite.config.ts: the SPA plus the salim-inn
    # marketing page), and the exact-match block above covers only the SPA — so
    # /salim-inn/index.html fell through to `location /` and was served with no
    # Cache-Control at all. Browsers then cache it heuristically off
    # Last-Modified and never revalidate, which is why visitors kept seeing a
    # pre-deploy copy whose "Book stay" still pointed at /register long after the
    # source had moved to /guest-portal?view=booking. A regex location cannot
    # steal /index.html from the exact match above, so this stays additive.
    #
    # `add_header` REPLACES the server-level set once a location declares any of
    # its own, so the security headers are repeated here to keep the ones these
    # documents already send in production.
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com https://challenges.cloudflare.com https://accounts.google.com https://*.googleapis.com; frame-src 'self' https://challenges.cloudflare.com https://accounts.google.com https://*.paypal.com https://*.paypalobjects.com https://*.venmo.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Do not send the SPA document as a fallback for a missing module. Browsers
    # surface that HTML-for-JavaScript response only as “Importing a module
    # script failed”, which hides the actual missing asset problem.
    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|avif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Guest deep links must load guest.html, not the staff ERP index.html.
    # KEEP IN SYNC with src/guest/guestDocumentPaths.ts
    location ^~ /guest-checkin { try_files $uri $uri/ /guest.html; }
    location ^~ /guest-portal { try_files $uri $uri/ /guest.html; }
    location ^~ /portal { try_files $uri $uri/ /guest.html; }
    location ^~ /offers { try_files $uri $uri/ /guest.html; }
    location ^~ /legal { try_files $uri $uri/ /guest.html; }
    location ^~ /unsubscribe { try_files $uri $uri/ /guest.html; }
    location = /login { try_files $uri /guest.html; }
    location = /register { try_files $uri /guest.html; }
    location = /verify-email { try_files $uri /guest.html; }
    location = /complete-profile { try_files $uri /guest.html; }

    # Serve the public document internally so anonymous visitors stay at /.
    # Session-bearing visitors still enter the staff app, which resolves their
    # account and dashboard. The legacy landing URL remains available for
    # existing links and explicit signed-in marketing-page visits.
    location = / {
        if ($cookie_refresh_token = "") { rewrite ^ /salim-inn/index.html last; }
        try_files $uri /index.html;
    }

    # Main location block for the staff ERP and remaining deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The weather (see proxy_cache_path above): MET Norway's Locationforecast,
    # free for commercial use with credit (CC BY 4.0; the page shows it). Its
    # terms (api.met.no/doc/TermsOfService): an identifying User-Agent with a
    # way to reach us, no request before the Expires time, If-Modified-Since
    # after it, coordinates to at most 4 decimals. KEEP the upstream path and
    # User-Agent IN SYNC with the dev proxy in vite.config.ts (MET_PATH).
    location = /salim-inn/weather.json {
        # Resolved per request through Docker's DNS, so nginx still starts when
        # DNS or the provider is down; the host reaches the internet through
        # its NAT'd IPv4 route (the containers have no IPv6).
        resolver 127.0.0.11 valid=300s ipv6=off;
        resolver_timeout 3s;
        set $met_norway api.met.no;
        proxy_pass https://$met_norway/weatherapi/locationforecast/2.0/compact?lat=2.2655&lon=111.8625;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name api.met.no;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host api.met.no;
        proxy_set_header User-Agent "SalimInn/1.0 https://saliminn.my";
        proxy_set_header Accept "application/json";
        # stored compressed (~5 kB rather than ~40 kB); gunzip serves any
        # client that cannot take gzip
        proxy_set_header Accept-Encoding "gzip";
        gunzip on;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        # one copy for everyone, kept until MET's Expires (30 minutes if a
        # response has none) and then revalidated with If-Modified-Since; the
        # last good copy stands in while MET fails (the page refuses a forecast
        # more than 18 hours old, so a long outage shows no weather, not old)
        proxy_cache weather;
        proxy_cache_key "sibu";
        proxy_cache_valid 200 30m;
        proxy_cache_valid any 1m;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 6s;
        proxy_ignore_headers Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Vary; # gzip_vary sends ours
        add_header Cache-Control "public, max-age=600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Weather-Cache $upstream_cache_status always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy API requests to backend (optional - disabled until backend is running)
    # location /api/ {
    #     proxy_pass http://backend:3030/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
