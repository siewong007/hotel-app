<!DOCTYPE html>
<html lang="en" data-boot-surface="staff">
  <head>
    <meta charset="utf-8" />
    <link id="app-favicon" rel="icon" type="image/png" href="/favicon.png" />
    <!-- viewport-fit=cover lets the layout use the full screen on notched
         phones; safe-area insets are published as --sat/--sab/--sal/--sar in
         index.css and consumed by the mobile nav, FAB, and sheets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0E13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Hotel Management System - Web Frontend" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Hotel ERP System</title>
    <script src="/guest-branding.js"></script>
    <!-- Static boot splash: the Salim Inn monogram, centered, on the surface
         the app will mount with (staff palette). guest-branding.js sets
         html[data-boot-theme] before first paint; src/index.tsx fades this
         out over the React LogoLoader, which renders the identical mark in
         the identical spot. Inline <style> is allowed by the CSP
         (style-src 'unsafe-inline'); inline <script> is not. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        background: #0b0e13;
        transition: opacity 160ms ease-out;
      }
      html[data-boot-theme='light'] #boot-splash {
        background: #f3f0e9;
      }
      #boot-splash.boot-splash--exit {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
      }
      noscript {
        position: fixed;
        inset: 0;
        z-index: 2147483001;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0e13;
        color: #f2eee3;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      html[data-boot-theme='light'] noscript {
        background: #f3f0e9;
        color: #1c1a14;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="boot-splash" role="status" aria-label="Loading">
      <svg viewBox="0 0 64 64" width="80" height="80" aria-hidden="true">
        <rect width="64" height="64" rx="15" fill="#0B211A" />
        <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#D9B572" stroke-width="3" />
        <path d="M13 27 32 13l19 14" fill="none" stroke="#D9B572" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M42 28c0-6-20-6-20 1 0 8 20 4 20 13 0 8-20 8-20 1" fill="none" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round" />
        <path d="M16 51h32" stroke="#D9B572" stroke-width="3" stroke-linecap="round" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
