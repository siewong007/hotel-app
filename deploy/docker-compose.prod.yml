# Production stack for saliminn.my on the AIC cloud VPS.
#
# The host-level Caddy process owns ports 80/443. Every hotel port is bound to
# loopback, so only Caddy (or an administrator on the VPS) can reach it.
# Payroll keeps 127.0.0.1:8080 and the host PostgreSQL server keeps :5432;
# this stack uses :3030 and :8081 with saliminn-specific names. Its PostgreSQL
# port is not published at all; maintenance uses `docker exec saliminn-db`.
#
# deploy/deploy.sh supplies IMAGE_TAG, POSTGRES_PASSWORD, and JWT_SECRET. The
# application images are loaded directly from the GitHub Actions release bundle;
# no container registry or managed cloud service is involved.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:19beta3
    container_name: saliminn-db
    restart: unless-stopped
    # Settings live here, not in ALTER SYSTEM: a `-c` command-line option outranks
    # postgresql.auto.conf, so anything set here silently wins over ALTER SYSTEM and
    # an operator changing it by SQL would see no effect. Keep the two in one place.
    command:
      - postgres
      - -c
      - max_connections=20
      - -c
      - shared_buffers=32MB
      # Was 4MB-equivalent (1MB); 102 temp files / 31MB spilled to disk over 9 days.
      # Worst case here is max_connections x work_mem = 80MB against mem_limit 256m,
      # alongside 32MB of shared_buffers — bounded.
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_parallel_workers=1
      # PostgreSQL's 4GB default is meaningless in a 256m container on a 2GB host: it
      # told the planner it had 16x the container's entire memory limit, biasing every
      # plan toward repeated index probes. 192MB is what this container can actually
      # cache, and the whole database is 85MB.
      - -c
      - effective_cache_size=192MB
      # Default 4 assumes seek-bound spinning disks. This is SSD-backed.
      - -c
      - random_page_cost=1.1
      # Query telemetry. The extension was already CREATEd in the database but never
      # loaded, so it silently collected nothing and every pg_stat_statements query
      # errored. Loading it requires a restart, which is why this rides a deploy.
      - -c
      - shared_preload_libraries=pg_stat_statements
      # Server-side slow log, to complement sqlx's app-side 500ms warning. Without it
      # the only query evidence available was whatever RUST_LOG=warn happened to catch.
      - -c
      - log_min_duration_statement=500ms
      - -c
      - log_temp_files=0
      # Bound a leaked transaction so it cannot pin locks and block autovacuum forever.
      # 5 minutes, not 60s: the data-transfer export path is deliberately allowed a
      # 120s statement_timeout (see core/db.rs), and this must stay clear of it.
      - -c
      - idle_in_transaction_session_timeout=300s
    environment:
      POSTGRES_USER: hotel_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: hotel_management
    volumes:
      # PostgreSQL 19 stores versioned data below /var/lib/postgresql.
      - postgres_data:/var/lib/postgresql
      # Applied by the official image only while postgres_data is empty.
      - /opt/saliminn/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_admin -d hotel_management"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    shm_size: 64mb
    mem_limit: 256m
    cpus: 0.30
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - database

  backend:
    image: "saliminn-backend:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: saliminn-backend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      DATABASE_URL: "postgres://hotel_admin:${POSTGRES_PASSWORD}@postgres:5432/hotel_management"
      DATABASE_MAX_CONNECTIONS: "5"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ISSUER: hotel-app-be
      JWT_AUDIENCE: hotel-web
      BACKEND_PORT: "3030"
      ALLOWED_ORIGINS: "https://saliminn.my,https://www.saliminn.my"
      PASSKEY_RP_ID: saliminn.my
      PUBLIC_BASE_URL: https://saliminn.my
      # Safe because the published port is loopback-only and Caddy is the sole
      # public path to it.
      TRUST_PROXY_HEADERS: "true"
      HOTEL_LOG_DIR: /app/logs
      RUST_LOG: warn
      ENVIRONMENT: production
      PAYPAL_ENABLED: "${PAYPAL_ENABLED:-false}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_API_BASE: "${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}"
      HOTEL_BANK_NAME: "${HOTEL_BANK_NAME:-Maybank}"
      HOTEL_BANK_ACCOUNT_NAME: "${HOTEL_BANK_ACCOUNT_NAME:-Salim Inn}"
      HOTEL_BANK_ACCOUNT_NUMBER: "${HOTEL_BANK_ACCOUNT_NUMBER:-511270052595}"
      # Outbound email. Supplied from /opt/saliminn/secrets.env (root-owned,
      # 0600) which deploy.sh sources before invoking compose — credentials
      # never enter the repository, the image, or GitHub Actions secrets.
      #
      # Optional: encrypt TOTP secrets at rest (AES-256-GCM). Generate with:
      #   openssl rand -base64 32
      TOTP_ENCRYPTION_KEY: "${TOTP_ENCRYPTION_KEY:-}"
      # Google sign-in. Optional: verify_id_token() fails closed with a 503
      # ("Google sign-in is not configured") when this is empty, and the
      # frontend hides the button, so an unset value disables the feature
      # cleanly rather than breaking startup. Must be the SAME OAuth client as
      # the VITE_GOOGLE_CLIENT_ID baked into the frontend image, or the
      # audience check rejects every credential.
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      # Cloudflare Turnstile on /api/auth/login and /api/auth/register.
      # Optional: with TURNSTILE_ENABLED unset or false both endpoints behave
      # exactly as today. When true, BOTH keys must be present and DIFFERENT or
      # the backend refuses to start -- pasting one key into both variables
      # leaves the widget rendering while every siteverify call fails, which
      # locks out real users. The site key must be the SAME one baked into the
      # frontend image as VITE_TURNSTILE_SITE_KEY; the secret key stays here.
      TURNSTILE_ENABLED: "${TURNSTILE_ENABLED:-false}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      # All optional: Transport::from_env() returns None unless BOTH SMTP_HOST
      # and SMTP_FROM_EMAIL are set, and the delivery worker then stays inert
      # rather than failing startup. Setting them is what enables guest email
      # and, later, operational alerting.
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Salim Inn}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
    volumes:
      # These bind mounts survive image/container replacement. eKYC documents
      # are private and remain accessible only through authenticated handlers.
      - /opt/saliminn/data/uploads:/app/uploads
      - /opt/saliminn/data/private_uploads:/app/private_uploads
      - /opt/saliminn/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3030/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Backup imports stream rows through a per-row insert transaction (a 256 MB
    # file parses at roughly 1x its byte size plus the in-flight row batch), so
    # the API needs headroom the old buffered-export 192m cap did not.
    mem_limit: 384m
    cpus: 0.45
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - app
      - database

  frontend:
    image: "saliminn-frontend:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: saliminn-frontend
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 64m
    cpus: 0.10
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging: *default-logging
    networks:
      - app

volumes:
  postgres_data:
    driver: local

networks:
  app:
    driver: bridge
  database:
    # Only the backend is dual-homed. PostgreSQL has no Internet-facing Docker
    # network and no published host port.
    internal: true
