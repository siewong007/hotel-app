[package]
name = "hotel-desktop"
version = "1.0.0"
description = "Hotel Management System - Desktop Application"
authors = ["Hotel App"]
edition = "2021"
rust-version = "1.95.0"

[lib]
name = "hotel_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process"] }
# rustls-only: default features would pull native-tls/OpenSSL into the lockfile.
# Keep the remaining defaults (charset/http2/system-proxy) — tauri-plugin-updater
# shares this reqwest instance via feature unification, so dropping them would
# change the auto-updater's transport (e.g. lose OS proxy support on Windows).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "charset", "http2", "system-proxy"] }
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
lazy_static = "1.4"
hex = "0.4"
rand = "0.8"
bcrypt = "0.17"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false
opt-level = 1
strip = false
debug = 0

[profile.release.build-override]
codegen-units = 16
debug = 0
opt-level = 0

[profile.release-fast.build-override]
codegen-units = 16
debug = 0
opt-level = 0
