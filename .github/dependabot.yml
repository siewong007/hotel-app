version: 2

# Grouping policy: minor and patch updates are batched into one PR per
# ecosystem per week and auto-merged on green by
# `.github/workflows/dependabot-auto-merge.yml`. Majors are deliberately left
# ungrouped so each one arrives as its own reviewable PR and is never
# auto-merged. Before grouping, a single weekly run could open seven separate
# PRs, and three of them sat red for five days.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The toolchain version is pinned in rust-toolchain.toml and in both
      # Cargo.toml `rust-version` fields; the action ref must follow those, not
      # lead them. Dependabot also cannot tell a real release from a phantom
      # here: dtolnay/rust-toolchain pre-creates branches for unreleased
      # versions (1.99.0 and 1.120.0 both exist as refs while the newest Rust
      # is 1.98.1), and it picks the numerically largest. That produced
      # "could not download nonexistent rust version 1.100.0" once and
      # "1.120.0" again in PR #165. Bump this ref by hand alongside the pins.
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: cargo
    directory: /hotel-app-be
    schedule:
      interval: weekly
    groups:
      backend-cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Majors still need a manual review pass — queries are runtime-checked,
      # so a breaking sqlx bump can compile clean and fail in production.
      # Minor/patch updates (incl. security fixes) keep flowing.
      - dependency-name: "sqlx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlx-*"
        update-types: ["version-update:semver-major"]

  # The desktop shell ships tauri + an embedded PostgreSQL to end users; it
  # needs its own advisory coverage, not just the backend's.
  - package-ecosystem: cargo
    directory: /hotel-desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      desktop-cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /hotel-desktop
    schedule:
      interval: weekly
    groups:
      desktop-bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /hotel-web-fe
    schedule:
      interval: weekly
    groups:
      frontend-bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # jsdom is held at an exact 30.0.1 on purpose (see b5413e34e). 30.1.0
      # pulls @asamuzakjp/dom-selector 8->9 and breaks MUI's FocusTrap with
      # "TypeError: nodeToRestore.current.focus is not a function", cascading
      # to 139 failures across 35 test files — every menu, dialog and
      # bottom-sheet suite. Bisected on a quiet machine: 30.1.0 fails 2/3,
      # 30.0.1 passes 3/3. Dependabot re-proposed it in PR #171 regardless.
      # Lift this only once that FocusTrap regression is confirmed fixed.
      - dependency-name: "jsdom"

  # Container base images. Without these two entries nothing watched them at
  # all: `debian:bookworm-slim` is the production backend runtime and
  # `nginx:1.28-alpine` serves the frontend, so a CVE in either shipped
  # unreported while cargo/bun/actions were fully covered.
  - package-ecosystem: docker
    directory: /hotel-app-be
    schedule:
      interval: weekly
    groups:
      backend-images-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /hotel-web-fe
    schedule:
      interval: weekly
    groups:
      frontend-images-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
