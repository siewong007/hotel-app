name: Desktop Build

# Deliberately NOT run on every PR/push: a real `tauri build` (embedded
# PostgreSQL provisioning + sidecar + bundling) is far too slow for the normal
# CI loop. This workflow exists to catch resource-glob/capability/sidecar
# packaging regressions that `ci.yml`'s placeholder-resource `cargo check`
# cannot — see docs/ongoing-dev.md (desktop CI packaging item).
#
# Platforms: macOS (aarch64), Windows (x86_64), Linux (x86_64). Each job builds
# the pinned PostgreSQL 19beta2 from the sha256-verified official source
# tarball, because no trustworthy prebuilt binaries for that pre-release exist
# (EDB's CDN rejects automated fetches; zonky embedded-postgres ships stable
# releases only). Details: hotel-desktop/PACKAGING.md.
on:
  workflow_dispatch:
    inputs:
      full_bundle:
        description: 'Produce full bundles (installers) instead of just the raw binary'
        type: boolean
        default: false
      platform:
        description: 'Which desktop platform(s) to build'
        type: choice
        options:
          - all
          - macos
          - windows
          - linux
        default: all
  push:
    tags:
      - 'v*'

# Least-privilege token: build jobs only read the repo and upload artifacts.
permissions:
  contents: read

jobs:
  desktop-build-macos:
    name: Desktop — Real Tauri Build (macOS aarch64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' }}
    # Apple Silicon runner: matches the aarch64-apple-darwin sidecar triple
    # this repo builds and embeds (see hotel-desktop/scripts/copy-backend-sidecar.mjs).
    runs-on: macos-14
    timeout-minutes: 60

    # Signing/notarization inputs mapped at job level — `secrets` is not a
    # legal context in step `if:` conditions. Every signing step below gates
    # on `env.* != ''`, so with no secrets provisioned the job still produces
    # unsigned bundles (today's default).
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # API-key notarization alternative to APPLE_ID+APPLE_PASSWORD: the P8
      # key material is decoded to a file by a step below (APPLE_API_KEY_PATH
      # is a path, so it comes through GITHUB_ENV, not a secret mapping).
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

    defaults:
      run:
        working-directory: hotel-desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies (backend)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-app-be

      - name: Cache Cargo dependencies (desktop)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-desktop/src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('hotel-web-fe/bun.lock', 'hotel-desktop/bun.lock') }}

      - name: Install frontend dependencies
        working-directory: hotel-web-fe
        run: bun ci

      - name: Install desktop dependencies
        working-directory: hotel-desktop
        run: bun ci

      # PostgreSQL 19 is still pre-release, so Homebrew does not provide a
      # versioned formula yet. Build the official beta source and pass its
      # installation prefix to the resource provisioning script. This MUST
      # track CONFIGURED_POSTGRES_BUILD_IDENTITY in
      # hotel-desktop/src-tauri/src/postgres.rs — provision:pgsql reads that
      # constant directly and refuses a POSTGRES_PREFIX build that doesn't
      # match it (see hotel-desktop/scripts/provision-pgsql.mjs
      # readExpectedVersion()).
      - name: Build PostgreSQL 19 Beta 2
        env:
          POSTGRES_VERSION: 19beta2
        run: |
          # PostgreSQL 16+ enables ICU by default, but Homebrew's icu4c is
          # keg-only and not on the default PKG_CONFIG_PATH — configure fails
          # with "Package 'icu-uc' not found" (first real run, 2026-07-12).
          # openssl@3 is keg-only too: without its flags, configure dies with
          # "library 'crypto' is required for OpenSSL" (run 30207255012).
          brew install icu4c lz4 pkg-config openssl@3
          ICU_PREFIX="$(brew --prefix icu4c)"
          LZ4_PREFIX="$(brew --prefix lz4)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="${ICU_PREFIX}/lib/pkgconfig:${LZ4_PREFIX}/lib/pkgconfig:${OPENSSL_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CPPFLAGS="-I${LZ4_PREFIX}/include -I${OPENSSL_PREFIX}/include ${CPPFLAGS:-}"
          export LDFLAGS="-L${LZ4_PREFIX}/lib -L${OPENSSL_PREFIX}/lib ${LDFLAGS:-}"
          curl --fail --location --remote-name "https://ftp.postgresql.org/pub/source/v${POSTGRES_VERSION}/postgresql-${POSTGRES_VERSION}.tar.bz2"
          curl --fail --location --remote-name "https://ftp.postgresql.org/pub/source/v${POSTGRES_VERSION}/postgresql-${POSTGRES_VERSION}.tar.bz2.sha256"
          shasum --algorithm 256 --check "postgresql-${POSTGRES_VERSION}.tar.bz2.sha256"
          tar -xjf "postgresql-${POSTGRES_VERSION}.tar.bz2"
          cd "postgresql-${POSTGRES_VERSION}"
          # @19-suffixed datadir/libdir are load-bearing (lessons 2026-07-26m):
          # provision-pgsql.mjs renames the bundled dirs to share/postgresql@19 +
          # lib/postgresql@19, and PG binaries self-locate via the COMPILED
          # relative tail — a plain --prefix build bakes in share/postgresql and
          # resolves to a missing dir inside the renamed bundle.
          PG_PREFIX="${RUNNER_TEMP}/postgresql-${POSTGRES_VERSION}"
          ./configure --prefix="${PG_PREFIX}" \
            --datadir="${PG_PREFIX}/share/postgresql@19" \
            --libdir="${PG_PREFIX}/lib/postgresql@19" \
            --with-openssl --with-lz4
          make -j"$(sysctl -n hw.ncpu)" world-bin
          make install-world-bin
          # provision-pgsql.mjs reads share/postgresql + lib/postgresql from the
          # source prefix; keep the @19 names as symlinks back.
          cd "${PG_PREFIX}"
          mv "share/postgresql@19" "share/postgresql"
          ln -s postgresql "share/postgresql@19"
          mv "lib/postgresql@19" "lib/postgresql"
          ln -s postgresql "lib/postgresql@19"
          # Job-wide, not just the provision step: tauri's beforeBuildCommand
          # (bun run desktop:prepare) re-runs provision:pgsql inside the build
          # steps and needs the same prefix if the tree must be re-provisioned.
          echo "POSTGRES_PREFIX=${PG_PREFIX}" >> "$GITHUB_ENV"

      - name: Provision embedded PostgreSQL tree
        run: bun run provision:pgsql

      # Throwaway keychain + Developer ID import. Secrets absent → step
      # skipped → tauri build finds no signing identity → unsigned .app/.dmg.
      # KEYCHAIN_PASSWORD is any string — it only locks this ephemeral
      # keychain, never the certificate itself.
      - name: Import Apple signing certificate
        if: ${{ env.APPLE_CERTIFICATE != '' }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      # The sidecar binary doesn't exist until cargo build + copy run inside
      # desktop:prepare (tauri's beforeBuildCommand) — produce it now so the
      # sign step has the Mach-Os to sign. The prepare re-run inside
      # `bun run build` is a cache hit; copy-backend-sidecar.mjs may re-copy
      # the cargo output over src-tauri/binaries/, which is why the sign
      # script signs BOTH locations.
      - name: Build backend sidecar (pre-sign)
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          bun scripts/build-backend-sidecar.mjs
          bun scripts/copy-backend-sidecar.mjs

      - name: Sign bundled resources
        if: ${{ env.APPLE_SIGNING_IDENTITY != '' }}
        run: bash scripts/sign-macos-resources.sh

      - name: Build desktop app (binary only)
        if: ${{ github.event.inputs.full_bundle != 'true' && github.ref_type != 'tag' }}
        run: bun run build:no-bundle

      - name: Build desktop app (full bundle)
        if: ${{ github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag' }}
        env:
          # Updater artifact signing (createUpdaterArtifacts: true). Absent →
          # tauri build HARD-FAILS here (sign_updaters requires the key once
          # pubkey is configured) — updater-enabled builds always need this
          # secret; there is no unsigned-manifest path.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Arms the SystemHealthPage update card in the FE bundle. Reaches
          # build-frontend.mjs via beforeBuildCommand → desktop:prepare; that
          # script forwards VITE_* to `vite build` and hashes it into the
          # bundle cache key.
          VITE_DESKTOP_UPDATER_ENABLED: "true"
        run: |
          # Scrub APPLE_* env before `bun run build`: tauri-cli/tauri-bundler
          # read them via var_os — presence, not non-emptiness — so the empty
          # strings the job env exports for absent secrets would break the
          # build (`codesign -s ""`, keychain import of an empty p12, or
          # notarytool with empty creds — notarization runs unconditionally
          # inside the signed branch, no --ci gate). The cert pair and all
          # notarization vars are unset unconditionally: this workflow owns
          # the keychain import, and the dedicated notarize-macos step is the
          # single notarization path. APPLE_SIGNING_IDENTITY is kept when
          # provisioned — the bundler does not auto-discover an identity;
          # it's how the outer .app gets signed against our build.keychain.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_P8 APPLE_API_KEY_PATH
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then unset APPLE_SIGNING_IDENTITY; fi
          bun run build

      # API-key auth path for notarytool: the P8 material lives in a secret
      # and is decoded to a file whose path goes through GITHUB_ENV
      # (APPLE_API_KEY_PATH). Skipped when the secret is absent; the
      # APPLE_ID+password path in the script needs no file.
      - name: Write App Store Connect API key
        if: ${{ (github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag') && env.APPLE_API_KEY_P8 != '' }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Runs only on bundle-producing builds with a COMPLETE credential set —
      # the gate mirrors what notarize-macos.sh requires: all three APPLE_ID
      # vars, or all three API-key vars (APPLE_API_KEY_P8 ⇒ the p8 file was
      # written by the step above). Unsigned default (no secrets) skips.
      - name: Notarize macOS bundle
        if: ${{ (github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag') && ((env.APPLE_ID != '' && env.APPLE_PASSWORD != '' && env.APPLE_TEAM_ID != '') || (env.APPLE_API_KEY != '' && env.APPLE_API_ISSUER != '' && env.APPLE_API_KEY_P8 != '')) }}
        run: |
          bash scripts/notarize-macos.sh
          # Remove the temp p8 the write step created — the RUNNER_TEMP guard
          # keeps a maintainer-supplied APPLE_API_KEY_PATH from being deleted.
          if [[ "${APPLE_API_KEY_PATH:-}" == "$RUNNER_TEMP/"* ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi

      # OS-level signing is conditional: with the APPLE_* secrets provisioned
      # the .app is signed during `tauri build` (bundled resources pre-signed
      # above) and the .dmg is notarized+stapled; without them installers are
      # unsigned. The updater *.sig files are minisign signatures from
      # TAURI_SIGNING_PRIVATE_KEY, unrelated to OS trust either way.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hotel-desktop-macos-aarch64
          retention-days: 14
          if-no-files-found: error
          path: |
            hotel-desktop/src-tauri/target/release/hotel-desktop
            hotel-desktop/src-tauri/target/release/bundle/**

  desktop-build-linux:
    name: Desktop — Real Tauri Build (Linux x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'linux' }}
    # ubuntu-24.04 pins the glibc floor (2.39) the bundled binaries support;
    # see hotel-desktop/PACKAGING.md for the compat matrix.
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    defaults:
      run:
        working-directory: hotel-desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies (backend)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-app-be

      - name: Cache Cargo dependencies (desktop)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-desktop/src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('hotel-web-fe/bun.lock', 'hotel-desktop/bun.lock') }}

      - name: Install frontend dependencies
        working-directory: hotel-web-fe
        run: bun ci

      - name: Install desktop dependencies
        working-directory: hotel-desktop
        run: bun ci

      # Two dep groups: PostgreSQL build requirements (same feature set as the
      # macOS job: OpenSSL, ICU, lz4) and the Tauri/WebKitGTK toolchain.
      # patchelf rewrites bundled rpaths (see provision-pgsql.mjs); xvfb +
      # libfuse2t64 are for the packaged-build smoke test only.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl ca-certificates pkg-config \
            libssl-dev libicu-dev liblz4-dev zlib1g-dev libreadline-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf xvfb
          # fuse is only needed to RUN an AppImage in the smoke test; the
          # package name changed between Ubuntu releases.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      # Same flags as the macOS job: the @19-suffixed datadir/libdir make the
      # compiled-in relative tails resolve correctly inside the bundle. Unlike
      # macOS, no rename is needed — the portable provisioner copies
      # share/postgresql@19 and lib/postgresql@19 verbatim.
      - name: Build PostgreSQL 19 Beta 2
        working-directory: ${{ runner.temp }}
        env:
          POSTGRES_VERSION: 19beta2
        run: |
          curl --fail --location --remote-name "https://ftp.postgresql.org/pub/source/v${POSTGRES_VERSION}/postgresql-${POSTGRES_VERSION}.tar.bz2"
          curl --fail --location --remote-name "https://ftp.postgresql.org/pub/source/v${POSTGRES_VERSION}/postgresql-${POSTGRES_VERSION}.tar.bz2.sha256"
          sha256sum --check "postgresql-${POSTGRES_VERSION}.tar.bz2.sha256"
          tar -xjf "postgresql-${POSTGRES_VERSION}.tar.bz2"
          cd "postgresql-${POSTGRES_VERSION}"
          PG_PREFIX="${RUNNER_TEMP}/postgresql-${POSTGRES_VERSION}"
          ./configure --prefix="${PG_PREFIX}" \
            --datadir="${PG_PREFIX}/share/postgresql@19" \
            --libdir="${PG_PREFIX}/lib/postgresql@19" \
            --with-openssl --with-lz4
          make -j"$(nproc)" world-bin
          make install-world-bin
          # Job-wide, not just the provision step: tauri's beforeBuildCommand
          # (bun run desktop:prepare) re-runs provision:pgsql inside the build
          # steps and needs the same prefix if the tree must be re-provisioned.
          echo "POSTGRES_PREFIX=${PG_PREFIX}" >> "$GITHUB_ENV"

      - name: Provision embedded PostgreSQL tree
        run: bun run provision:pgsql

      - name: Build desktop app (binary only)
        if: ${{ github.event.inputs.full_bundle != 'true' && github.ref_type != 'tag' }}
        run: bun run build:no-bundle

      # Explicit bundle list instead of `bun run build` ("all"): every bundle
      # build ships deb + AppImage + rpm (RPM support verified — install-smoked
      # on fedora:41, run 35424550838). tauri-bundler writes .rpm in-process
      # via the `rpm` crate, so no rpmbuild toolchain is needed — but
      # tauri-bundler 2.9.x (cli 2.11.4, pinned) has a known indefinite hang
      # in that path (tauri-apps/tauri#15698), so `timeout` bounds every
      # bundle build instead of letting a silent hang burn the job budget.
      - name: Build desktop app (deb + AppImage + rpm)
        if: ${{ github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Arms the SystemHealthPage update card in the FE bundle — same
          # VITE_* forwarding path as the macOS step above.
          VITE_DESKTOP_UPDATER_ENABLED: "true"
        run: timeout --signal=TERM --kill-after=30 3600 bun scripts/tauri-build.mjs --bundles deb,appimage,rpm

      - name: Package portable archive
        run: bun run package:portable

      # Smoke test for packaged builds: install the .deb, then verify the
      # BUNDLED PostgreSQL binaries report the pinned build and the app binary
      # launches (GUI probe under xvfb). Asserts the packaging contract, not
      # just the compile.
      - name: Smoke test .deb install
        if: ${{ github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          deb=$(ls src-tauri/target/release/bundle/deb/*.deb | head -1)
          sudo dpkg -i "$deb" || sudo apt-get install -f -y
          pkg=$(dpkg-deb -f "$deb" Package)
          pg_bin="$(dpkg -L "$pkg" | grep -E '/pgsql/bin/postgres$' | head -1)"
          test -n "$pg_bin" || { echo "bundled postgres missing from .deb"; exit 1; }
          version="$("$pg_bin" --version)"
          echo "bundled postgres: $version"
          case "$version" in *19beta2*) ;; *) echo "unexpected bundled PostgreSQL: $version"; exit 1;; esac
          # The pgsql/bin tools share the /bin/ path segment, so match the app
          # binary by exact name (Cargo bin name / tauri mainBinaryName), with
          # pgsql/ excluded regardless.
          app_bin="$(dpkg -L "$pkg" | grep -vE '/pgsql/' | grep -E '/hotel-desktop$' | head -1)"
          test -n "$app_bin" || { echo "installed app binary missing from .deb"; exit 1; }
          echo "installed app binary: $app_bin"
          # Launch probe: a GUI app that survives 25s under xvfb got far enough
          # to start services; `timeout` exit 124 means it was still alive.
          set +e
          timeout --signal=TERM 25 xvfb-run -a "$app_bin" > /tmp/desktop-smoke.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            cat /tmp/desktop-smoke.log
            exit 1
          fi
          echo "launch probe result rc=$rc (124 = still running = pass)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hotel-desktop-linux-x86_64
          retention-days: 14
          if-no-files-found: error
          path: |
            hotel-desktop/src-tauri/target/release/hotel-desktop
            hotel-desktop/src-tauri/target/release/bundle/deb/**
            hotel-desktop/src-tauri/target/release/bundle/appimage/**
            hotel-desktop/src-tauri/target/release/bundle/*-portable.tar.gz
            # Only the .rpm files, not the staged rpm/ tree the bundler
            # leaves next to them. Matches nothing on binary-only builds —
            # harmless when absent.
            hotel-desktop/src-tauri/target/release/bundle/rpm/**/*.rpm

      # RPM install smoke, AFTER the upload so the artifact survives a failed
      # install. Inspect the package on the host, then dnf-install it in a
      # clean fedora:41 container and verify the app binary + bundled
      # PostgreSQL. Fails loudly — a green artifact that doesn't install is
      # worse than a red run. always() && !cancelled() so it still runs when
      # an earlier check (e.g. the deb smoke) already failed — the report is
      # the evidence either way; gated on the bundle step's condition so
      # binary-only dispatches skip it.
      - name: Smoke test .rpm install (Fedora)
        if: ${{ always() && !cancelled() && (github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag') }}
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP}/rpm-smoke-report.md"
          # `rpm` is needed here for -qpR/-ql inspection only — the bundle
          # itself was written in-process by tauri-bundler's `rpm` crate.
          sudo apt-get install -y rpm

          shopt -s nullglob
          rpms=(src-tauri/target/release/bundle/rpm/*.rpm)
          if [ "${#rpms[@]}" -eq 0 ]; then
            {
              echo "## RPM install smoke"
              echo
              echo "- **no .rpm artifact** under \`src-tauri/target/release/bundle/rpm/\` —"
              echo "  the bundle step produced none (see its log; a silent stop after"
              echo "  \"Bundling *.rpm\" is the known tauri-apps/tauri#15698 hang)."
            } | tee "$REPORT"
            exit 1
          fi
          RPM_FILE="${rpms[0]}"
          PKG_NAME="$(rpm -qp --queryformat '%{NAME}' "$RPM_FILE")"
          echo "rpm artifact: $RPM_FILE (package: $PKG_NAME)"

          {
            echo "## RPM install smoke"
            echo
            echo "- artifact: \`$(basename "$RPM_FILE")\`"
            echo "- package name: \`$PKG_NAME\`"
            echo
            echo '### `rpm -qpR` — declared dependencies'
            echo '```'
            rpm -qpR "$RPM_FILE"
            echo '```'
            echo
            echo '### fedora:41 container install smoke'
            echo '```'
          } | tee "$REPORT"

          # Mount hotel-desktop at /src (read-only); dnf resolves the rpm's
          # declared deps from Fedora's repos, then verify package
          # registration, the app binary, and the bundled postgres build —
          # all inside the clean container. Non-zero exits propagate through
          # PIPESTATUS so the step fails loudly.
          set +e
          docker run --rm \
            -v "$PWD:/src:ro" -w /src \
            -e "RPM_PATH=/src/${RPM_FILE}" \
            -e "PKG_NAME=${PKG_NAME}" \
            fedora:41 bash -lc '
              set -euo pipefail
              dnf install -y "$RPM_PATH"
              rpm -q "$PKG_NAME"
              app_bin="$(command -v hotel-desktop)"
              echo "app binary: $app_bin"
              ls -la "$app_bin"
              pg_bin="$(rpm -ql "$PKG_NAME" | grep -E "/pgsql/bin/postgres$" | head -1)"
              test -n "$pg_bin" || { echo "bundled postgres missing from package"; exit 1; }
              version="$("$pg_bin" --version)"
              echo "bundled postgres: $version"
              case "$version" in *19beta2*) ;; *) echo "unexpected bundled PostgreSQL: $version"; exit 1 ;; esac
              echo "RPM install smoke: PASS"
            ' 2>&1 | tee -a "$REPORT"
          rc="${PIPESTATUS[0]}"
          set -e
          {
            echo '```'
            echo
            echo "- install smoke: \`exit ${rc}\`"
          } | tee -a "$REPORT"
          if [ "$rc" -ne 0 ]; then
            echo "RPM install smoke failed (rc=$rc) — see report" >&2
            exit "$rc"
          fi

      # always() so the smoke evidence lands even when the step above failed.
      - name: RPM smoke summary
        if: ${{ always() && (github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag') }}
        run: |
          REPORT="${RUNNER_TEMP}/rpm-smoke-report.md"
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## RPM install smoke"
              echo
              echo "- smoke step did not run — no report produced (check the job log)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  desktop-build-windows:
    name: Desktop — Real Tauri Build (Windows x86_64)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 120

    # Job-level, not just the provision step: tauri's beforeBuildCommand
    # (bun run desktop:prepare) re-runs provision:pgsql inside the build steps
    # and needs the same prefix if the tree must be re-provisioned.
    env:
      POSTGRES_PREFIX: C:\hotel-pg19
      # Signing inputs are mapped at JOB level, not step level: `secrets`/`vars`
      # are legal here, and a value the PFX-import step writes to GITHUB_ENV
      # overrides job env (a step-level `env:` on the bundle step would shadow
      # it instead). Two supported paths, both absent-proof:
      #   WINDOWS_CERT_PFX_BASE64+PASSWORD — import into CurrentUser\My (hosted)
      #   WINDOWS_CERT_THUMBPRINT         — cert already in the store (self-hosted)
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      WINDOWS_CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
      WINDOWS_SIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_SIGN_TIMESTAMP_URL }}

    defaults:
      run:
        working-directory: hotel-desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies (backend)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-app-be

      - name: Cache Cargo dependencies (desktop)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-desktop/src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('hotel-web-fe/bun.lock', 'hotel-desktop/bun.lock') }}

      - name: Install frontend dependencies
        working-directory: hotel-web-fe
        run: bun ci

      - name: Install desktop dependencies
        working-directory: hotel-desktop
        run: bun ci

      # nasm: required by aws-lc-sys (rustls) in the backend build.
      # winflexbison3: PostgreSQL meson build prerequisite.
      # pkgconfiglite: lets meson locate the vcpkg-built dependencies.
      - name: Install build tools
        run: |
          choco install -y winflexbison3 nasm pkgconfiglite
          python -m pip install --upgrade meson ninja

      # vcpkg provides OpenSSL/lz4/zlib/ICU for the PostgreSQL meson build.
      # windows-latest ships vcpkg at VCPKG_INSTALLATION_ROOT; bootstrap a fresh
      # copy if the image ever drops it.
      - name: Install PostgreSQL dependencies (vcpkg)
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg -or -not (Test-Path (Join-Path $vcpkg 'vcpkg.exe'))) {
            $vcpkg = Join-Path $env:RUNNER_TEMP 'vcpkg'
            git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkg
            & (Join-Path $vcpkg 'bootstrap-vcpkg.bat')
          }
          & (Join-Path $vcpkg 'vcpkg.exe') install --triplet x64-windows openssl lz4 zlib icu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PKG_CONFIG_PATH=$vcpkg\installed\x64-windows\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download PostgreSQL 19 Beta 2 source
        working-directory: ${{ runner.temp }}
        env:
          POSTGRES_VERSION: 19beta2
        run: |
          $tarball = "postgresql-$env:POSTGRES_VERSION.tar.bz2"
          curl.exe --fail --location --remote-name "https://ftp.postgresql.org/pub/source/v$env:POSTGRES_VERSION/$tarball"
          curl.exe --fail --location --remote-name "https://ftp.postgresql.org/pub/source/v$env:POSTGRES_VERSION/$tarball.sha256"
          $expected = (Get-Content "$tarball.sha256").Split(' ')[0].Trim().ToLower()
          $actual = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "sha256 mismatch for ${tarball}: $actual != $expected" }
          tar -xjf $tarball

      # Meson is the only supported Windows build for PG19 (the old MSVC perl
      # scripts were removed). vcvars64 is located via vswhere so the recipe
      # survives runner image changes. -Dicu=auto: ICU collations come along
      # when vcpkg's pkgconfig resolves; the build does not hinge on it.
      # vswhere output is captured through a temp file, not `for /f` command
      # substitution: its path lives under "Program Files (x86)", and the ')'
      # inside a for-command's parenthesized list ends the command early
      # (cmd expands %vars% before matching parens) -> "\Microsoft was
      # unexpected at this time." (run 35354808394).
      - name: Build PostgreSQL 19 Beta 2 (Meson + MSVC)
        working-directory: ${{ runner.temp }}
        shell: cmd
        env:
          POSTGRES_VERSION: 19beta2
          PG_PREFIX: C:\hotel-pg19
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath > "%TEMP%\vsinstall.txt"
          for /f "usebackq delims=" %%i in ("%TEMP%\vsinstall.txt") do set "VSINSTALL=%%i"
          if not defined VSINSTALL (echo "vswhere could not locate a Visual Studio C++ toolchain" && exit /b 1)
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          meson setup pgbuild "postgresql-%POSTGRES_VERSION%" --prefix "%PG_PREFIX%" --buildtype release -Dssl=openssl -Dlz4=enabled -Dzlib=enabled -Dicu=auto -Dnls=disabled -Dplperl=disabled -Dplpython=disabled -Dpltcl=disabled -Dtap_tests=disabled -Ddocs=disabled || exit /b 1
          meson compile -C pgbuild || exit /b 1
          meson install -C pgbuild || exit /b 1

      # meson install only installs PostgreSQL's own artifacts — the vcpkg
      # runtime DLLs must ride along in bin/, where Windows resolves them.
      - name: Stage dependency DLLs into the prefix
        run: |
          Copy-Item "$env:VCPKG_ROOT\installed\x64-windows\bin\*.dll" "C:\hotel-pg19\bin\"
          Get-ChildItem "C:\hotel-pg19\bin" | Measure-Object | Out-Default

      - name: Provision embedded PostgreSQL tree
        run: bun run provision:pgsql

      - name: Build desktop app (binary only)
        if: ${{ github.event.inputs.full_bundle != 'true' && github.ref_type != 'tag' }}
        run: bun run build:no-bundle

      # PFX path for hosted runners: decode the base64 PFX into a temp file,
      # import into CurrentUser\My, then hand the resolved thumbprint to the
      # bundle step via GITHUB_ENV (overrides the job-env thumbprint secret,
      # which may be empty — the imported cert is guaranteed to be in the
      # store). Secrets absent → step skipped → unsigned, the default.
      - name: Import code-signing certificate
        if: ${{ env.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'hotel-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $pwd = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -Password $pwd -CertStoreLocation Cert:\CurrentUser\My
          Remove-Item $pfx -Force
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Certificate imported (thumbprint resolved; expires $($cert.NotAfter.ToString('yyyy-MM-dd')))"

      # NSIS is the always-on Windows installer; MSI joins it on tag releases
      # (WiX toolchain download adds build time, so validation builds skip it).
      # Signing is conditional: WINDOWS_CERT_THUMBPRINT reaches this step from
      # job env (self-hosted store secret) or from the PFX import above via
      # GITHUB_ENV (hosted runners) — either way Tauri signs exe + installers
      # via signtool. Absent → unsigned artifacts, by design.
      - name: Build desktop app (NSIS / MSI)
        if: ${{ github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Arms the SystemHealthPage update card in the FE bundle — same
          # VITE_* forwarding path as the macOS/Linux steps.
          VITE_DESKTOP_UPDATER_ENABLED: "true"
        run: |
          $bundles = 'nsis'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $bundles = 'nsis,msi' }
          $buildArgs = @('--bundles', $bundles)
          if ($env:WINDOWS_CERT_THUMBPRINT) {
            $timestampUrl = if ($env:WINDOWS_SIGN_TIMESTAMP_URL) { $env:WINDOWS_SIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
            $config = '{"bundle":{"windows":{"certificateThumbprint":"' + $env:WINDOWS_CERT_THUMBPRINT + '","digestAlgorithm":"sha256","timestampUrl":"' + $timestampUrl + '"}}}'
            $buildArgs += @('--config', $config)
            Write-Host "Windows signing enabled via certificateThumbprint (timestamp: $timestampUrl)"
          } else {
            Write-Host "WINDOWS_CERT_THUMBPRINT not set — producing unsigned installers"
          }
          & bun scripts/tauri-build.mjs @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable archive
        run: bun run package:portable

      # Smoke test for packaged builds: silent-install the NSIS artifact, then
      # verify the installed tree contains the app, the sidecar, and a bundled
      # PostgreSQL that reports the pinned build. Asserts the packaging
      # contract on a real Windows session, not just the compile.
      - name: Smoke test NSIS install
        if: ${{ github.event.inputs.full_bundle == 'true' || github.ref_type == 'tag' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS setup exe not found' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $app = Get-ChildItem $env:LOCALAPPDATA -Recurse -Filter 'hotel-desktop.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $app) { throw 'hotel-desktop.exe not found under %LOCALAPPDATA% after silent install' }
          $installDir = $app.Directory.FullName
          $pg = Join-Path $installDir 'pgsql\bin\postgres.exe'
          # tauri-bundler strips the -<triple> suffix when installing
          # externalBin (installed name: hotel-app-be.exe) — match both names,
          # recursing in case it ever lands in a subdirectory.
          $sidecar = Get-ChildItem $installDir -Recurse -Filter 'hotel-app-be*.exe' | Select-Object -First 1
          if (-not (Test-Path $pg)) { throw "bundled postgres.exe missing at $pg" }
          if (-not $sidecar) { throw 'backend sidecar missing from install' }
          $version = & $pg --version
          Write-Host "bundled postgres: $version"
          if ($version -notmatch '19beta2') { throw "unexpected bundled PostgreSQL: $version" }
          Write-Host "NSIS install verified at $installDir"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hotel-desktop-windows-x86_64
          retention-days: 14
          if-no-files-found: error
          path: |
            hotel-desktop/src-tauri/target/release/hotel-desktop.exe
            hotel-desktop/src-tauri/binaries/hotel-app-be-*.exe
            hotel-desktop/src-tauri/target/release/bundle/nsis/**
            hotel-desktop/src-tauri/target/release/bundle/msi/**
            hotel-desktop/src-tauri/target/release/bundle/*-portable.zip

  # Tag pushes only: assembles latest.json from the three platforms' updater
  # artifacts and publishes it (plus installers) to the tag's GitHub Release,
  # which is the updater endpoint configured in tauri.conf.json. The
  # full_bundle workflow_dispatch path intentionally does NOT publish.
  desktop-release:
    name: Publish GitHub Release + updater manifest
    if: ${{ github.ref_type == 'tag' }}
    needs: [desktop-build-macos, desktop-build-windows, desktop-build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Download build artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: hotel-desktop-*
          path: artifacts

      - name: Assemble release assets + latest.json
        run: |
          bun hotel-desktop/scripts/build-update-manifest.mjs \
            --tag "$GITHUB_REF_NAME" --artifacts artifacts \
            --repo "$GITHUB_REPOSITORY" --out release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Idempotent: a re-run of this job finds the release already exists.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              release-assets/*
          fi
