name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least-privilege token: these jobs only read the repo (gitleaks gets an
# explicit push-scoped token below).
permissions:
  contents: read

jobs:
  security-gate:
    name: Security — Secrets & Rust advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-app-be

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check Rust dependency advisories
        run: cargo audit

  docs:
    name: Docs — Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check Markdown links resolve
        run: python3 scripts/check-doc-links.py

  proto:
    name: Proto — buf lint & breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Breaking-change check diffs against the base branch ref.
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0

      - name: Check proto formatting
        run: buf format --diff --exit-code proto

      - name: Lint protos
        run: buf lint proto

      # No proto/ baseline exists on master until the first contract lands;
      # the check activates itself once one does.
      - name: Check for breaking proto changes
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:proto/buf.yaml" 2>/dev/null; then
            buf breaking proto --against ".git#branch=origin/${{ github.base_ref }},subdir=proto"
          else
            echo "No proto module on ${{ github.base_ref }}; skipping breaking check"
          fi

  db-mirror:
    name: Repo — Desktop DB mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # hotel-desktop/src-tauri/database/ is a hand-run copy of the backend's
      # (`bun run sync:resources`), and the desktop job below compiles against
      # PLACEHOLDER resources — so nothing else in CI compares the two trees. A
      # schema change that is never mirrored ships a desktop build with a stale
      # baseline, and a CRLF checkout fails every manifest checksum and silently
      # disables the whole patch catalog. Shell only, so it fails in seconds.
      - name: Check desktop DB bundle matches the backend
        run: scripts/check-desktop-db-mirror.sh

  frontend:
    name: Frontend — Typecheck, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-web-fe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('hotel-web-fe/bun.lock') }}

      - name: Install dependencies
        run: bun ci

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint:strict

      - name: Test
        run: bun run test -- --run --coverage

      - name: Build
        run: bun run build

  backend:
    name: Backend — Check, Lint & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19beta3
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: hotel-app-be

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Cache Cargo dependencies
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-app-be

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev postgresql-client pkg-config libssl-dev

      - name: Cargo check
        run: cargo check --all-features

      - name: Cargo test
        run: cargo test --all-features

      - name: PostgreSQL schema smoke
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          HOTEL_RUN_PG_SCHEMA_SMOKE: "1"
        run: cargo test --all-features --test status_vocabulary postgres_smoke::postgres_v1_lifecycle_builds_the_final_schema

      - name: Prepare PostgreSQL workflow database
        run: |
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS hotel_workflow_test WITH (FORCE)"
          psql postgres://postgres:postgres@localhost:5432/postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE hotel_workflow_test"
          psql postgres://postgres:postgres@localhost:5432/hotel_workflow_test -v ON_ERROR_STOP=1 -f database/postgres/migrations/0001_v1_baseline.sql

      - name: PostgreSQL booking workflow tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotel_workflow_test
        run: cargo test --all-features --test booking_service postgres_concurrent_reactivation_allows_only_one_success

      - name: Cargo clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Cargo build (release)
        run: cargo build --release

  backend-postgres-smoke:
    name: Backend — PostgreSQL Smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-app-be

    services:
      postgres:
        image: postgres:19beta3
        env:
          POSTGRES_DB: hotel_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hotel_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hotel_ci
      JWT_SECRET: ci_jwt_secret_must_be_at_least_32_chars_long
      BACKEND_PORT: 3030
      ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-app-be

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpq-dev pkg-config libssl-dev postgresql-client curl

      - name: Apply PostgreSQL schema and seed data
        run: |
          psql "$DATABASE_URL" -f database/postgres/migrations/0001_v1_baseline.sql
          psql "$DATABASE_URL" -f database/postgres/seed.sql

      # Backup-format regression gate: production recovery depends on
      # pg_dump --format=custom output that pg_restore can actually consume.
      # A schema/role change that silently breaks the dump->restore path must
      # fail here, not during an incident. Same check the deploy and nightly
      # scripts apply to every dump they produce.
      - name: Verify pg_dump/pg_restore round-trip
        run: |
          # Client tools must match the server: apt postgresql-client is older
          # than postgres:19beta3 and pg_dump aborts on the version mismatch,
          # so the dump/restore runs inside the same image as the service.
          psql "$DATABASE_URL" -c "DROP DATABASE IF EXISTS hotel_ci_restore" \
                             -c "CREATE DATABASE hotel_ci_restore"
          docker run --rm --network host -e PGPASSWORD=postgres postgres:19beta3 bash -c '
            set -euo pipefail
            pg_dump --format=custom --no-owner --no-acl -f /tmp/hotel_ci.dump -h localhost -U postgres hotel_ci
            pg_restore --list /tmp/hotel_ci.dump >/dev/null
            pg_restore --no-owner --no-acl -h localhost -U postgres -d hotel_ci_restore /tmp/hotel_ci.dump
          '
          # Semantic equality gate, not a text diff: pg_dump --schema-only emits
          # per-dump \restrict tokens and re-deparses CHECK expressions after
          # restore, so byte comparison is flaky. Compare object inventory and
          # exact row counts — that is what a partial/broken restore loses.
          RESTORE_URL="${DATABASE_URL%/*}/hotel_ci_restore"
          OBJECTS_SQL="SELECT 'tables', count(*) FROM pg_tables WHERE schemaname='public'
             UNION ALL SELECT 'columns', count(*) FROM information_schema.columns WHERE table_schema='public'
             UNION ALL SELECT 'indexes', count(*) FROM pg_indexes WHERE schemaname='public'
             UNION ALL SELECT 'constraints', count(*) FROM information_schema.table_constraints WHERE table_schema='public'
             UNION ALL SELECT 'sequences', count(*) FROM information_schema.sequences WHERE sequence_schema='public'
             UNION ALL SELECT 'functions', count(*) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public'
             UNION ALL SELECT 'triggers', count(*) FROM information_schema.triggers WHERE trigger_schema='public'
             ORDER BY 1"
          COUNTQ=$(psql "$DATABASE_URL" -Atc "SELECT string_agg(format('SELECT %L AS t, count(*) FROM %I', tablename, tablename), ' UNION ALL ') || ' ORDER BY t' FROM pg_tables WHERE schemaname='public'")
          diff <(psql "$DATABASE_URL" -Atc "$OBJECTS_SQL") \
               <(psql "$RESTORE_URL" -Atc "$OBJECTS_SQL")
          diff <(psql "$DATABASE_URL" -Atc "$COUNTQ") \
               <(psql "$RESTORE_URL" -Atc "$COUNTQ")

      - name: Verify PostgreSQL patch lifecycle
        run: cargo test --test postgres_patch_lifecycle -- --nocapture

      # staging.sql is the canonical rerunnable staging dataset. Apply it twice:
      # the second run must be a no-op delete+reinsert inside the 800000-899999
      # id band, so row counts must be identical across runs. It gets its own
      # database: the fixtures intentionally stay in place, and tests sharing
      # hotel_ci assert exact global counts (the delivery feed counted
      # staging's email_deliveries rows as its own).
      - name: Verify staging dataset applies and reruns idempotently
        run: |
          STAGING_URL="${DATABASE_URL%/*}/hotel_ci_staging"
          psql "$DATABASE_URL" -c "DROP DATABASE IF EXISTS hotel_ci_staging" \
                             -c "CREATE DATABASE hotel_ci_staging"
          psql "$STAGING_URL" -f database/postgres/migrations/0001_v1_baseline.sql
          psql "$STAGING_URL" -f database/postgres/seed.sql
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -f database/postgres/staging.sql
          first=$(psql "$STAGING_URL" -At -c "SELECT COUNT(*) FROM bookings WHERE id BETWEEN 800000 AND 899999")
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 -f database/postgres/staging.sql
          second=$(psql "$STAGING_URL" -At -c "SELECT COUNT(*) FROM bookings WHERE id BETWEEN 800000 AND 899999")
          test "$first" -gt 0 && test "$first" = "$second"
          psql "$STAGING_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF EXISTS (
                  SELECT 1 FROM payments p
                  WHERE p.id BETWEEN 800000 AND 899999
                    AND NOT EXISTS (SELECT 1 FROM bookings b WHERE b.id = p.booking_id)
              ) THEN
                  RAISE EXCEPTION 'staging seed left orphan payments';
              END IF;
          END;
          $$;
          SQL

      # The V1 baseline/seed set is intentionally one-shot. Reapplying it
      # is an invalid lifecycle operation, so assert the completed installation
      # and its core schema instead of expecting those files to be idempotent.
      - name: Verify PostgreSQL V1 installation
        run: |
          test "$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c \
            "SELECT COUNT(*) FROM hotel_schema_revisions WHERE generation = 1 AND version = 1")" = "1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
              IF to_regclass('public.users') IS NULL
                 OR to_regclass('public.bookings') IS NULL
                 OR to_regclass('public.system_settings') IS NULL THEN
                  RAISE EXCEPTION 'PostgreSQL V1 core schema is incomplete';
              END IF;
          END;
          $$;
          SQL

      - name: Run PostgreSQL tests
        run: cargo test --all-features

      # Fix-gated characterization tests (tests/*_characterization.rs) assert the
      # DECIDED-CORRECT money behavior for bugs that are not fixed yet, so they are
      # #[ignore]d and are EXPECTED to fail here. This step therefore does NOT fail
      # when they fail. It fails when one of them PASSES, which means the fix landed
      # and the #[ignore] is now stale: remove the attribute so the test becomes a
      # real regression guard. Each #[ignore] reason names the pending fix.
      - name: Report fix-gated tests and catch stale ignores
        run: |
          cargo test --all-features -- --ignored > /tmp/ignored.txt 2>&1 || true
          cat /tmp/ignored.txt
          if grep -qE '^test .+ \.\.\. ok$' /tmp/ignored.txt; then
            echo "::error::A fix-gated #[ignore]d test now PASSES — its fix has landed, so remove the #[ignore] attribute:"
            grep -E '^test .+ \.\.\. ok$' /tmp/ignored.txt
            exit 1
          fi
          echo "OK: every fix-gated test still fails as expected — no stale #[ignore]."

      # Build the binary in its own step so the health-check loop below only
      # waits on startup, not a cold compile. `cargo run` compiles first, which
      # can exceed the 30s probe window and make the check spuriously fail.
      - name: Build backend binary
        run: cargo build --bin hotel-app-be

      - name: Start backend and verify PostgreSQL connection
        run: |
          ./target/debug/hotel-app-be > /tmp/hotel-app-be.log 2>&1 &
          backend_pid=$!

          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3030/health; then
              kill "$backend_pid"
              wait "$backend_pid" || true
              exit 0
            fi

            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat /tmp/hotel-app-be.log
              exit 1
            fi

            sleep 1
          done

          cat /tmp/hotel-app-be.log
          kill "$backend_pid" || true
          exit 1

  desktop:
    name: Desktop — Cargo Check & Test (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-desktop/src-tauri

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-desktop/src-tauri

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev

      # Tauri's build script fails `cargo check` when the `externalBin` sidecar
      # or the `resources` globs (embedded PostgreSQL under pgsql/) match no
      # files. Those binaries are downloaded per-platform at release time and are
      # gitignored, so a clean checkout lacks them. Stage empty placeholders so
      # the desktop crate type-checks; the real binaries are bundled by
      # `tauri build`, not by this compile-check job.
      - name: Stage placeholder desktop resources
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          install -D /dev/null "binaries/hotel-app-be-$triple"
          install -D /dev/null pgsql/bin/placeholder
          install -D /dev/null pgsql/lib/placeholder
          install -D /dev/null pgsql/share/placeholder

      - name: Cargo check
        run: cargo check

      # The desktop crate has real unit tests (postmaster.pid parsing, pgdata
      # build-identity classification, patch-catalog validation). psql-spawning
      # tests are #[cfg(unix)]-gated or skip without DESKTOP_TEST_* env vars.
      - name: Cargo test
        run: cargo test

  # Same gate on Windows: exercises the cfg(windows) code paths (sidecar .exe
  # naming, CREATE_NO_WINDOW spawning, \\?\ stripping) that the Linux job cannot
  # compile. Full tauri bundling stays in desktop-build.yml — it is too slow for
  # the per-PR loop.
  desktop-windows:
    name: Desktop — Cargo Check & Test (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hotel-desktop/src-tauri

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache Cargo dependencies
        if: ${{ !env.ACT }}
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: hotel-desktop/src-tauri

      # aws-lc-sys (via rustls) builds C/asm in its build script: cmake is
      # preinstalled on the runner, NASM is not.
      - name: Install NASM
        run: choco install -y nasm

      - name: Stage placeholder desktop resources
        run: |
          $triple = (rustc -vV | Select-String '^host: ').Line -replace 'host: ', ''
          New-Item -ItemType File -Force -Path "binaries/hotel-app-be-$triple.exe" | Out-Null
          New-Item -ItemType File -Force -Path "pgsql/bin/placeholder" | Out-Null
          New-Item -ItemType File -Force -Path "pgsql/lib/placeholder" | Out-Null
          New-Item -ItemType File -Force -Path "pgsql/share/placeholder" | Out-Null

      - name: Cargo check
        run: cargo check

      - name: Cargo test
        run: cargo test
