version: "3.9"

services:
  postgres:
    image: postgres:18
    container_name: hotel-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_TO_STRONG_PASSWORD_MIN_16_CHARS}
      POSTGRES_DB: ${POSTGRES_DB:-hotel_management}
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./hotel-app-be/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./hotel-app-be/database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel_admin} -d ${POSTGRES_DB:-hotel_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  backend:
    build:
      context: ./hotel-app-be
      dockerfile: Dockerfile
    container_name: hotel-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3030}:3030"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hotel_admin}:${POSTGRES_PASSWORD:-CHANGE_ME_TO_STRONG_PASSWORD_MIN_16_CHARS}@postgres:5432/${POSTGRES_DB:-hotel_management}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_TO_RANDOM_STRING_MIN_32_CHARACTERS_LONG_FOR_SECURITY}
      BACKEND_PORT: ${BACKEND_PORT:-3030}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      RUST_LOG: ${RUST_LOG:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotel-network

  frontend:
    build:
      context: ./hotel-web-fe
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3030}
    container_name: hotel-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - hotel-network

volumes:
  postgres18_data:
    driver: local

networks:
  hotel-network:
    driver: bridge
