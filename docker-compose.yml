services:
  postgres:
    image: postgres:19beta2
    container_name: hotel-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hotel_admin}
      # No fallback by design: a placeholder default would let an unedited stack
      # start on a credential published in this repository. Same pattern as
      # deploy/docker-compose.prod.yml.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env and set a strong value}"
      POSTGRES_DB: ${POSTGRES_DB:-hotel_management}
    volumes:
      - postgres19_data:/var/lib/postgresql
      - ./hotel-app-be/database/postgres/migrations/0001_v1_baseline.sql:/docker-entrypoint-initdb.d/01-v1-baseline.sql:ro
      - ./hotel-app-be/database/postgres/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hotel_admin} -d ${POSTGRES_DB:-hotel_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  backend:
    build:
      context: ./hotel-app-be
      dockerfile: Dockerfile
    container_name: hotel-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3030}:3030"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hotel_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hotel_management}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set at least 32 random characters}"
      BACKEND_PORT: ${BACKEND_PORT:-3030}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Read X-Forwarded-For for rate limiting; enable ONLY behind a trusted
      # TLS-terminating proxy such as the caddy service (see SECURITY.md).
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      RUST_LOG: ${RUST_LOG:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PAYPAL_ENABLED: ${PAYPAL_ENABLED:-false}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      HOTEL_BANK_NAME: ${HOTEL_BANK_NAME:-}
      HOTEL_BANK_ACCOUNT_NAME: ${HOTEL_BANK_ACCOUNT_NAME:-}
      HOTEL_BANK_ACCOUNT_NUMBER: ${HOTEL_BANK_ACCOUNT_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3030/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hotel-network

  frontend:
    build:
      context: ./hotel-web-fe
      dockerfile: Dockerfile
      args:
        # Leave empty for runtime same-origin routing through Caddy. An explicit
        # value remains available for deployments with a separate API origin.
        VITE_API_URL: "${VITE_API_URL:-}"
    container_name: hotel-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - hotel-network

  # HTTPS entry point (enable with: docker compose --profile https up -d).
  # Terminates TLS with automatic Let's Encrypt certificates and routes API
  # prefixes to the backend, everything else to the frontend SPA.
  caddy:
    image: caddy:2-alpine
    container_name: hotel-caddy
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Public hostname to serve; "localhost" makes Caddy self-sign a local cert.
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      # max-age=0 clears any HSTS pin on "localhost" — a pin applies to every
      # port and would force-upgrade the plain-HTTP Vite dev server on :3000.
      # Override with the production value if DOMAIN is a real public hostname.
      HSTS_VALUE: ${HSTS_VALUE:-max-age=0}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Cert/ACME state must persist — losing it re-hits Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - hotel-network

volumes:
  postgres19_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  hotel-network:
    driver: bridge
