# Code generation config — Phase 2 (Rust server) and Phase 3 (TS client).
# Nothing is generated in Phase 1; this file is reviewed with the contract.
version: v2
plugins:
  # ── TypeScript (Phase 3) ──────────────────────────────────────────────
  # protoc-gen-es v2 generates message types AND Connect-ES v2 service
  # clients in a single pass; protoc-gen-connect-es is obsolete under v2.
  - remote: buf.build/bufbuild/es:v2.14.1
    out: ../hotel-web-fe/src/gen
    opt:
      - target=ts
      # the repo sets erasableSyntaxOnly, so enums must emit as const objects.
      - erasable_syntax=true

  # ── Rust (Phase 2) ────────────────────────────────────────────────────
  # Rust codegen is NOT run through buf: hotel-app-be/build.rs compiles the
  # mirrored protos via tonic-prost-build (the Docker build context is the
  # crate dir only). Keep hotel-app-be/proto/ in sync with `make sync-proto`;
  # scripts/check-proto-mirror.sh enforces parity in CI.
